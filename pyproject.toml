[project]
name = "workday-manager"
version = "0.1.0"
description = "Personal Chief of Staff Agent — AI-powered workday manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-ai>=0.0.14",
    "nylas>=6.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "models", "tools", "agents", "routes", "controllers", "repository", "utils", "graph"]
